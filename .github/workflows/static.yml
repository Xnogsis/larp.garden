# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always the branch tip: a manual dispatch fired right after the Garfield bot's
          # push resolved to the commit before it and deployed stale content.
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache Celeste assets
        uses: actions/cache@v4
        with:
          path: celeste-assets/4f043a5ce121b74dc54ce56d74f213a2eeea6b4e
          key: celeste-assets-4f043a5ce121b74dc54ce56d74f213a2eeea6b4e-v1
      - name: Prepare Celeste assets
        run: bash .github/scripts/prepare-celeste.sh
      - name: Cache Snow Rider assets
        uses: actions/cache@v4
        with:
          path: snow-rider-assets/6b7c2b9167b592528b221428414e63f06c4640b9
          key: snow-rider-assets-6b7c2b9167b592528b221428414e63f06c4640b9-v1
      - name: Prepare Snow Rider assets
        run: bash .github/scripts/prepare-snow-rider.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Celeste assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          asset_base="${PAGES_URL%/}/celeste-assets/4f043a5ce121b74dc54ce56d74f213a2eeea6b4e"
          for asset in styles.css assets/mountain.png cfg.js data.js bundle.js _framework/dotnet.js _framework/FNA.wasm; do
            curl --head --location --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$asset_base/$asset" >/dev/null
          done
      - name: Verify published Snow Rider assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          asset_base="${PAGES_URL%/}/snow-rider-assets/6b7c2b9167b592528b221428414e63f06c4640b9"
          for asset in index.html TemplateData/style.css TemplateData/UnityProgress.js Build/UnityLoader.js Build/SnowRider3D-gd-1.json Build/SnowRider3D-gd-1.data.unityweb Build/SnowRider3D-gd-1.wasm.code.unityweb Build/SnowRider3D-gd-1.wasm.framework.unityweb.js; do
            curl --head --location --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$asset_base/$asset" >/dev/null
          done
