name: Refresh gn-math catalog

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "catalog"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the covers
        run: |
          git clone --depth 1 https://github.com/Xnogsis/covers.git "$RUNNER_TEMP/covers"
          pip install --quiet pillow==11.3.0

      - name: Refresh zones.json and thumbnails
        run: python .github/scripts/catalog.py "$RUNNER_TEMP/covers"

      - name: Commit if changed
        id: commit
        run: |
          git add zones.json t
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gn-math catalog for $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not fire the push trigger on other workflows,
      # so kick the Pages deploy by hand.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
