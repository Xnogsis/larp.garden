name: Refresh game catalogs

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "catalog"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin catalog and game sources
        run: python3 .github/scripts/source_pins.py --update

      - name: Get the covers
        run: |
          git clone --depth 1 https://github.com/Xnogsis/covers.git "$RUNNER_TEMP/covers"
          git -C "$RUNNER_TEMP/covers" fetch --depth 1 origin "$(python3 .github/scripts/source_pins.py --get Xnogsis/covers)"
          git -C "$RUNNER_TEMP/covers" checkout --detach FETCH_HEAD
          pip install --quiet pillow==11.3.0

      - name: Refresh zones.json and thumbnails
        run: python .github/scripts/catalog.py "$RUNNER_TEMP/covers"

      - name: Refresh UGS catalog
        run: |
          git clone --bare --depth 1 --filter=blob:none https://github.com/Xnogsis/ugs-singlefile.git "$RUNNER_TEMP/ugs"
          git -C "$RUNNER_TEMP/ugs" fetch --depth 1 origin "$(python3 .github/scripts/source_pins.py --get Xnogsis/ugs-singlefile)"
          git -C "$RUNNER_TEMP/ugs" update-ref HEAD FETCH_HEAD
          python .github/scripts/ugs-catalog.py "$RUNNER_TEMP/ugs"

      - name: Commit if changed
        id: commit
        run: |
          git add zones.json t ugs-games.json game-source-pins.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Game catalogs for $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not fire the push trigger on other workflows,
      # so kick the Pages deploy by hand.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
