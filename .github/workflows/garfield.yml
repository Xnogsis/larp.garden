name: Fetch daily Garfield

on:
  schedule:
    # 06:15 UTC = just after midnight in US time zones, when the new strip is up
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "garfield"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look up today's strip on GoComics
        id: strip
        run: |
          set -euo pipefail
          date_slug=$(TZ=America/New_York date +%Y/%m/%d)
          date_iso=$(TZ=America/New_York date +%Y-%m-%d)
          page="https://www.gocomics.com/garfield/${date_slug}"
          html=$(curl -sSL --max-time 60 "$page" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Site: none" \
            -H "Upgrade-Insecure-Requests: 1")
          image=$(printf '%s' "$html" | grep -oE 'property="og:image" content="[^"]+"' | head -1 | sed -E 's/.*content="([^"]+)"/\1/')
          case "$image" in
            https://featureassets.gocomics.com/assets/*) ;;
            *) echo "Could not find the strip image on $page (got: '$image')"; exit 1 ;;
          esac
          printf '{\n  "date": "%s",\n  "image": "%s",\n  "url": "%s"\n}\n' "$date_iso" "$image" "$page" > garfield.json
          cat garfield.json

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- garfield.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garfield.json
          git commit -m "Garfield for $(TZ=America/New_York date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not fire the push trigger on other workflows,
      # so kick the Pages deploy by hand.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
