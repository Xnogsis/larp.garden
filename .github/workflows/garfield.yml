name: Fetch daily Garfield

on:
  schedule:
    # 06:15 UTC = just after midnight in US time zones, when the new strip is up
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "garfield"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install a browser for the bot-shield fallback
        run: |
          pip install --quiet playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Look up today's strip on GoComics
        run: xvfb-run --auto-servernum python .github/scripts/garfield.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- garfield.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garfield.json
          git commit -m "Garfield for $(TZ=America/New_York date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not fire the push trigger on other workflows,
      # so kick the Pages deploy by hand.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
