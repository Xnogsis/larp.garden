<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clever</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        #fake-404 {
            padding: 8px;
        }

        #fake-404 h1 {
            font-size: 2em;
            margin-block-start: 0.67em;
            margin-block-end: 0.67em;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div id="fake-404">
        <center><h1>404 Not Found</h1></center>
        <hr><center>nginx/1.18.0</center>
    </div>


    <script>
        // The hub loaders need service workers, which only exist on https.
        if (location.protocol === "http:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            location.replace("https://" + location.host + location.pathname + location.search + location.hash);
        }

        const validTargets = ["antimatter.html", "gnmath.html", "ugs.html", "isaac.html", "balatro/index.html", "home.html", "tv.html"];

        function unlockSite(targetUrl) {
            document.cookie = "access_granted=" + targetUrl + "; max-age=" + (60 * 60 * 24 * 30) + "; path=/";
            location.replace(targetUrl);
        }

        if (location.search || location.hash) history.replaceState(null, "", location.pathname);

        const cookie = document.cookie.split(';').find((item) => item.trim().startsWith('access_granted='));
        if (cookie) {
            let savedUrl = cookie.split('=')[1].trim();
            if (savedUrl === "help.html" || savedUrl === "home.html") savedUrl = "gnmath.html";
            if (validTargets.includes(savedUrl)) {
                unlockSite(savedUrl);
            } else {
                document.cookie = "access_granted=; max-age=0; path=/";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || ["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
            e.preventDefault();
            unlockSite("gnmath.html");
        });
    </script>
</body>
</html>
