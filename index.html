<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        #fake-404 {
            padding: 8px;
        }

        #fake-404 h1 {
            font-size: 2em;
            margin-block-start: 0.67em;
            margin-block-end: 0.67em;
            font-weight: bold;
        }

        #content-frame {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Unlocked state styles */
        body.unlocked {
            overflow: hidden;
            background-color: transparent;
        }

        body.unlocked #fake-404 { 
            display: none; 
        }

        body.unlocked #content-frame { 
            display: block; 
        }
    </style>
</head>
<body>

    <div id="fake-404">
        <center><h1>404 Not Found</h1></center>
        <hr><center>nginx/1.18.0</center>
    </div>

    <iframe id="content-frame" src="about:blank"></iframe>

    <dialog id="modification-dialog" aria-labelledby="modification-title">
        <h2 id="modification-title">Page modified</h2>
        <p>This page's elements changed:</p>
        <p id="modification-detail"></p>
        <button type="button" id="modification-allow">Add to whitelist</button>
        <button type="button" id="modification-remove">Remove element</button>
        <button type="button" id="modification-close">Close</button>
    </dialog>

    <script>
        // The hub loaders need service workers, which only exist on https.
        if (location.protocol === "http:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            location.replace("https://" + location.host + location.pathname + location.search + location.hash);
        }

        const validTargets = ["antimatter.html", "gnmath.html", "isaac.html"];

        function unlockSite(targetUrl) {
            document.body.classList.add('unlocked');
            document.title = "Clever"; // Restores the original title upon unlocking
            document.getElementById('content-frame').src = targetUrl;
            document.cookie = "access_granted=" + targetUrl + "; max-age=" + (60 * 60 * 24 * 30) + "; path=/";
            window.dispatchEvent(new Event('site-unlocked'));
        }

        if (location.search || location.hash) history.replaceState(null, "", location.pathname);

        const cookie = document.cookie.split(';').find((item) => item.trim().startsWith('access_granted='));
        if (cookie) {
            let savedUrl = cookie.split('=')[1].trim();
            if (savedUrl === "help.html" || savedUrl === "home.html") savedUrl = "gnmath.html";
            if (validTargets.includes(savedUrl)) {
                unlockSite(savedUrl);
            } else {
                document.cookie = "access_granted=; max-age=0; path=/";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.body.classList.contains('unlocked')) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            unlockSite("gnmath.html");
        });
    </script>
    <script>
        // Watch top-level changes after unlocking; whitelist or remove only at the user's request.
        (() => {
            const roots = [document.documentElement, document.body];
            const known = new WeakSet();
            const ignoredRemovals = new WeakSet();
            const dialog = document.getElementById('modification-dialog');
            const detail = document.getElementById('modification-detail');
            const remove = document.getElementById('modification-remove');
            const queue = [];
            let current;
            const KEY = "tripwire_allowed";
            let allowed;
            try { allowed = new Set(JSON.parse(localStorage.getItem(KEY)) || []); } catch (e) { allowed = new Set(); }
            const describe = (n) => n.localName + (n.id ? "#" + n.id : "") + [...n.classList].map((c) => "." + c).join("");
            const showNext = () => {
                if (dialog.open) return;
                current = queue.shift();
                if (!current) return;
                if (allowed.has(current.what)) return showNext();
                detail.textContent = current.what;
                remove.disabled = !current.node.isConnected;
                dialog.showModal();
            };
            const trip = (what, node) => {
                console.warn("page modified:", what);
                queue.push({ what, node });
                showNext();
            };
            document.getElementById('modification-allow').addEventListener('click', () => {
                allowed.add(current.what);
                try { localStorage.setItem(KEY, JSON.stringify([...allowed])); } catch (e) { /* storage full or blocked */ }
                dialog.close();
            });
            remove.addEventListener('click', () => {
                ignoredRemovals.add(current.node);
                current.node.remove();
                dialog.close();
            });
            document.getElementById('modification-close').addEventListener('click', () => dialog.close());
            dialog.addEventListener('close', showNext);
            const watch = new MutationObserver((records) => {
                for (const r of records) {
                    for (const n of r.addedNodes) {
                        if (n.nodeType !== 1 || known.has(n)) continue;
                        known.add(n);
                        if (!allowed.has("added " + describe(n))) trip("added " + describe(n), n);
                    }
                    for (const n of r.removedNodes) {
                        if (ignoredRemovals.has(n)) { ignoredRemovals.delete(n); continue; }
                        if (n.nodeType === 1 && known.has(n) && !allowed.has("removed " + describe(n))) trip("removed " + describe(n), n);
                    }
                }
            });
            const start = () => {
                for (const root of roots) {
                    for (const el of root.children) known.add(el);
                    watch.observe(root, { childList: true });
                }
            };
            if (document.body.classList.contains('unlocked')) start();
            else window.addEventListener('site-unlocked', start, { once: true });
        })();
    </script>
</body>
</html>
