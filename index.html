<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        #fake-404 {
            padding: 8px;
        }

        #fake-404 h1 {
            font-size: 2em;
            margin-block-start: 0.67em;
            margin-block-end: 0.67em;
            font-weight: bold;
        }

        #content-frame {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Unlocked state styles */
        body.unlocked {
            overflow: hidden;
            background-color: transparent;
        }

        body.unlocked #fake-404 { 
            display: none; 
        }

        body.unlocked #content-frame { 
            display: block; 
        }
    </style>
</head>
<body>

    <div id="fake-404">
        <center><h1>404 Not Found</h1></center>
        <hr><center>nginx/1.18.0</center>
    </div>

    <iframe id="content-frame" src="about:blank"></iframe>

    <script>
        const helpPage = "help.html";
        const validTargets = [
            "antimatter.html", "arctic.html", helpPage,
            "gnmath.html", "umbrion.html", "dotgui.html", "projecthub.html",
            "cherri.html", "duckmath.html", "lite3kh0.html",
        ];

        function unlockSite(targetUrl) {
            document.body.classList.add('unlocked');
            document.title = "Clever"; // Restores the original title upon unlocking
            document.getElementById('content-frame').src = targetUrl;
            document.cookie = "access_granted=" + targetUrl + "; max-age=" + (60 * 60 * 24 * 30) + "; path=/";
        }

        const cookie = document.cookie.split(';').find((item) => item.trim().startsWith('access_granted='));
        if (cookie) {
            const savedUrl = cookie.split('=')[1].trim();
            if (validTargets.includes(savedUrl)) {
                unlockSite(savedUrl);
            } else {
                document.cookie = "access_granted=; max-age=0; path=/";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.body.classList.contains('unlocked')) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            unlockSite(helpPage);
        });
    </script>
</body>
</html>
