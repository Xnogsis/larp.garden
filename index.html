<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        #fake-404 {
            padding: 8px;
        }

        #fake-404 h1 {
            font-size: 2em;
            margin-block-start: 0.67em;
            margin-block-end: 0.67em;
            font-weight: bold;
        }

        #content-frame {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Unlocked state styles */
        body.unlocked {
            overflow: hidden;
            background-color: transparent;
        }

        body.unlocked #fake-404 { 
            display: none; 
        }

        body.unlocked #content-frame { 
            display: block; 
        }
    </style>
</head>
<body>

    <div id="fake-404">
        <center><h1>404 Not Found</h1></center>
        <hr><center>nginx/1.18.0</center>
    </div>

    <iframe id="content-frame" src="about:blank"></iframe>

    <script>
        // The hub loaders need service workers, which only exist on https.
        if (location.protocol === "http:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            location.replace("https://" + location.host + location.pathname + location.search + location.hash);
        }

        const homePage = "home.html";
        const validTargets = [
            "antimatter.html", "arctic.html", homePage,
            "gnmath.html", "gnmirror.html", "umbrion.html", "dotgui.html", "projecthub.html",
            "cherri.html", "duckmath.html", "lite3kh0.html", "cmx.html", "artclass.html",
        ];

        function unlockSite(targetUrl) {
            document.body.classList.add('unlocked');
            document.title = "Clever"; // Restores the original title upon unlocking
            document.getElementById('content-frame').src = targetUrl;
            document.cookie = "access_granted=" + targetUrl + "; max-age=" + (60 * 60 * 24 * 30) + "; path=/";
        }

        if (location.search || location.hash) history.replaceState(null, "", location.pathname);

        const cookie = document.cookie.split(';').find((item) => item.trim().startsWith('access_granted='));
        if (cookie) {
            let savedUrl = cookie.split('=')[1].trim();
            if (savedUrl === "help.html") savedUrl = homePage; // cookies from before the rename
            if (validTargets.includes(savedUrl)) {
                unlockSite(savedUrl);
            } else {
                document.cookie = "access_granted=; max-age=0; path=/";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.body.classList.contains('unlocked')) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            unlockSite(homePage);
        });
    </script>
    <script>
        // Tripwire: shows a notice when something outside this page adds or removes a
        // top-level element in this tab (e.g. an extension's overlay). Read-only: it
        // never touches, hides or disables anything that made the change.
        (() => {
            const roots = [document.documentElement, document.body];
            const known = new WeakSet();
            for (const root of roots) for (const el of root.children) known.add(el);
            let notice = null;
            const trip = (what) => {
                console.warn("page modified:", what);
                if (notice) return;
                notice = document.createElement("div");
                notice.id = "tripwire";
                notice.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#fff;color:#000;border-bottom:2px solid #000;font:16px 'Times New Roman',serif;padding:6px 10px";
                notice.textContent = "This page was changed from outside (" + what + "). ";
                const dismiss = document.createElement("button");
                dismiss.type = "button";
                dismiss.textContent = "dismiss";
                dismiss.addEventListener("click", () => { notice.remove(); notice = null; });
                notice.append(dismiss);
                document.documentElement.append(notice);
            };
            const watch = new MutationObserver((records) => {
                for (const r of records) {
                    for (const n of r.addedNodes) {
                        if (n.nodeType === 1 && n.id !== "tripwire" && !known.has(n)) { known.add(n); return trip("added <" + n.localName + ">"); }
                    }
                    for (const n of r.removedNodes) {
                        if (n.nodeType === 1 && known.has(n)) return trip("removed <" + n.localName + ">");
                    }
                }
            });
            for (const root of roots) watch.observe(root, { childList: true });
        })();
    </script>
</body>
</html>
