# Anubis bot policy for larp.garden
# Docs: https://anubis.techaro.lol/docs/admin/policies
bots:
  # Ships with the Anubis image: block known AI scrapers, allow real search engines
  # (Google, Bing, DDG, Internet Archive...), keep robots.txt/favicon/.well-known working,
  # and challenge everything that looks like a browser with proof-of-work.
  - import: (data)/meta/default-config.yaml

dnsbl: false

status_codes:
  CHALLENGE: 200
  DENY: 200
