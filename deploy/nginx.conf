server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # never expose repo internals
    location ~ /\.(git|github|env) { return 404; }
    location ~ ^/(deploy/|docker-compose\.yml$) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpe?g|gif|css|js|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
