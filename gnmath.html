<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gn-math</title>
    <link rel="stylesheet" href="gnmath.css">
</head>
<body>
    <h1>gn-math <span>/ mirrored catalog</span></h1>
    <div id="bar">
        <input id="search" type="search" placeholder="Search games" autocomplete="off">
        <span id="count"></span>
        <a href="home.html">back to home</a>
    </div>
    <p id="status">Loading the game list...</p>
    <ul id="grid"></ul>
    <footer>
        Games and covers are pulled from gn-math's public GitHub repos (and a mirror of them), not hosted here.
        Each game belongs to the author shown on its page.
    </footer>

    <div id="viewer">
        <div id="viewer-bar">
            <button type="button" id="close">&larr; back</button>
            <b id="viewer-title"></b>
            <span id="viewer-author"></span>
            <button type="button" id="fullscreen">fullscreen</button>
        </div>
        <iframe id="frame" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>

    <!-- gn-math's own org is blocked on jsDelivr; the freebuisness fork tracks it and is not.
         sw.js uses the same repos for the game files themselves (hub "gnmath"). -->
    <script src="gnmath.js" data-hub="gnmath" data-title="gn-math" data-sources="
        https://cdn.jsdelivr.net/gh/freebuisness/
        https://raw.githubusercontent.com/gn-math/
        https://gcore.jsdelivr.net/gh/freebuisness/
        https://raw.githubusercontent.com/freebuisness/
    "></script>
</body>
</html>
