<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gn-math</title>
    <link rel="stylesheet" href="style.css">
    <script>if (localStorage.theme !== "light") document.documentElement.classList.add("dark");</script>
</head>
<body>
    <header id="top">
        <a class="brand" href="home.html">larp.garden</a>
        <nav><a href="home.html">Home</a><a href="gnmath.html" aria-current="page">Games</a><a href="ugs.html">UGS</a></nav>
        <button type="button" id="theme">Light</button>
    </header>
    <main>
        <h1>gn-math</h1>
        <div id="bar">
            <input id="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
            <span id="count"></span>
        </div>
        <p id="status">Loading the game list...</p>
        <ul id="grid"></ul>
        <footer>
            Games and covers are pulled from Xnogsis's forks of gn-math's public GitHub repos.
            Each game belongs to the author shown on its page.
        </footer>
    </main>

    <div id="viewer">
        <div id="viewer-bar">
            <button type="button" id="close">&larr; back</button>
            <b id="viewer-title"></b>
            <span id="viewer-author"></span>
            <button type="button" id="newtab">new tab</button>
            <button type="button" id="blank">about:blank</button>
            <button type="button" id="jsdtab">jsDelivr tab</button>
            <button type="button" id="hidebar">hide bar</button>
            <button type="button" id="fullscreen">fullscreen</button>
        </div>
        <button type="button" id="showbar" title="show bar">&#9662;</button>
        <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>

    <!-- Catalog and covers use our forks; sw.js uses Xnogsis/html for the game files. -->
    <script src="gnmath.js" data-sources="
        https://esm.sh/gh/Xnogsis/
        https://cdn.jsdelivr.net/gh/Xnogsis/
    "></script>
</body>
</html>
