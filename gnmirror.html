<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gn-math mirror</title>
    <link rel="stylesheet" href="gnmath.css">
    <script>if (localStorage.theme === "dark") document.documentElement.classList.add("dark");</script>
</head>
<body>
    <h1>gn-math mirror <span>/ our own copy on jsDelivr</span></h1>
    <div id="bar">
        <input id="search" type="search" placeholder="Search games" autocomplete="off">
        <span id="count"></span>
        <a href="home.html">back to home</a>
    </div>
    <p id="status">Loading the game list...</p>
    <ul id="grid"></ul>
    <footer>
        Same catalog as gn-math, but games, assets and covers come from this site owner's forks
        (Xnogsis/html, Xnogsis/assets, Xnogsis/covers) through jsDelivr. Each game belongs to the author shown on its page.
    </footer>

    <div id="viewer">
        <div id="viewer-bar">
            <button type="button" id="close">&larr; back</button>
            <b id="viewer-title"></b>
            <span id="viewer-author"></span>
            <button type="button" id="newtab">new tab</button>
            <button type="button" id="blank">about:blank</button>
            <button type="button" id="hidebar">hide bar</button>
            <button type="button" id="fullscreen">fullscreen</button>
        </div>
        <button type="button" id="showbar" title="show bar">&#9662;</button>
        <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>

    <!-- sw.js hub "gnmirror" serves the game pages from Xnogsis/html and rewrites the
         asset/cover URLs inside them to the Xnogsis forks too. -->
    <script src="gnmath.js" data-hub="gnmirror" data-title="gn-math mirror" data-sources="
        https://cdn.jsdelivr.net/gh/Xnogsis/
        https://gcore.jsdelivr.net/gh/Xnogsis/
        https://fastly.jsdelivr.net/gh/Xnogsis/
        https://testingcf.jsdelivr.net/gh/Xnogsis/
        https://raw.githubusercontent.com/Xnogsis/
    "></script>
</body>
</html>
