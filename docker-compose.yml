# larp.garden behind Anubis (https://anubis.techaro.lol/)
#
#   Internet -> caddy (TLS) -> anubis (bot challenge) -> nginx (this repo's HTML)
#
# Deploy:  cp .env.example .env  &&  edit DOMAIN  &&  docker compose up -d
# Update:  git pull  (nginx serves the checkout directly, no rebuild needed)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      anubis:
        condition: service_healthy

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    restart: unless-stopped
    environment:
      BIND: ":8080"
      DIFFICULTY: ${ANUBIS_DIFFICULTY:-4}
      METRICS_BIND: ":9090"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://nginx"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
      WEBMASTER_EMAIL: ${WEBMASTER_EMAIL:-}
    volumes:
      - ./deploy/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  caddy_data:
  caddy_config:
